<app-navbar></app-navbar>
<div class="register-wrapper">

	<div class="card-left">
		
		<h1 class="title">Cadastro do Brechó</h1>

		<form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="form-container" novalidate>
			<div class="field">
				<input formControlName="nome" class="input-pill" type="text" placeholder="NOME DO BRECHÓ" aria-label="Nome do brechó" />
			</div>

			<div class="field">
				<input formControlName="cpf" class="input-pill" type="text" placeholder="CPF" aria-label="CPF" />
			</div>

			<div class="field">
				<input formControlName="telefone" class="input-pill" type="tel" placeholder="TELEFONE" aria-label="Telefone" />
			</div>

			<div class="field">
				<input formControlName="senha" class="input-pill" type="password" placeholder="SENHA" aria-label="Senha" />
			</div>

			<div class="actions">
				<button type="submit" class="submit-btn" [disabled]="carregando">ENVIAR</button>
			</div>

			<p class="success" *ngIf="mensagemSucesso">{{ mensagemSucesso }}</p>
			<p class="error" *ngIf="mensagemErro">{{ mensagemErro }}</p>
		</form>
	</div>

	<div class="card-right">
  		<img src="https://tse4.mm.bing.net/th/id/OIP.CYhOd3GwAMvCh3xNcaveVQHaE7?rs=1&pid=ImgDetMain&o=7&rm=3" alt="Imagem do Brechó">
	</div>
</div>
